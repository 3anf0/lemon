# Increased memory for Gradle daemon and Kotlin compiler
org.gradle.jvmargs=-Xmx3072m -Xms512m -Dfile.encoding=UTF-8 -XX:MaxMetaspaceSize=768m -XX:+HeapDumpOnOutOfMemoryError -Dkotlin.daemon.jvm.options=-Xmx2048m

org.gradle.daemon=true
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configureondemand=false

# Kotlin daemon gets its own memory budget
kotlin.daemon.jvm.options=-Xmx2048m -Xms256m

# Android settings
android.useAndroidX=true
android.enableJetifier=false
kotlin.code.style=official
